name: Package Whisper Model

on:
  push:
    paths:
      - '.github/workflows/package-whisper-model.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download multilingual Whisper small q5_1 model
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin?download=true' \
            --output ggml-small-q5_1.bin
          test "$(stat -c%s ggml-small-q5_1.bin)" -gt 190000000
          sha256sum ggml-small-q5_1.bin | tee SHA256SUMS

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-model-small-q5_1
          path: |
            ggml-small-q5_1.bin
            SHA256SUMS
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
