name: Import Life K-Line Source

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/import-life-kline.yml

permissions:
  contents: write

jobs:
  import-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination branch
        uses: actions/checkout@v4
        with:
          ref: life-kline-white-ui
          fetch-depth: 0

      - name: Check out upstream Life K-Line
        uses: actions/checkout@v4
        with:
          repository: miounet11/life-kline
          ref: main
          path: upstream

      - name: Replace temporary branch files with upstream source
        shell: bash
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'upstream' \
            -exec rm -rf {} +
          rsync -a --exclude='.git' upstream/ ./
          rm -rf upstream
          printf '%s\n' \
            'Source imported from https://github.com/miounet11/life-kline' \
            'Base commit: 7abf184df370452ee8279d72c8b45bc09e19913b' \
            'White UI redesign branch maintained by hnaco.' \
            > .life-kline-imported

      - name: Commit imported source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: import miounet11/life-kline source [skip ci]' || true
          git push origin HEAD:life-kline-white-ui
